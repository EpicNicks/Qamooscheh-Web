name: qamooscheh-web

# Production stack for this repo alone — one service, meant to run alongside
# Qamooscheh's own compose.yaml on the same host. Same conventions as that
# stack: bound to 127.0.0.1 only, your host nginx is the sole public entry
# point (proxying app.<domain> here, api.<domain>/cdn.<domain> to the
# backend's own containers).
#
# .env.docker is NOT auto-loaded by `docker compose up` (docker-compose only
# auto-loads a plain `.env`, and this is deliberately named differently so
# Vite's own dev-mode env loading never touches it — see .env.docker.example).
# Always run with --env-file:
#   docker compose --env-file .env.docker up -d --build

services:
  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_CONTENT_BASE_URL: ${VITE_CONTENT_BASE_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to ::1 first in this
      # image and nginx's `listen 8080;` doesn't bind the IPv6 side, so wget
      # gets an immediate connection refused before ever trying IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/_health"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "127.0.0.1:${WEB_PORT:-8082}:8080"
