# Serves the built SPA. Listens on 8080, matching every other internal
# service in this stack (see Qamooscheh's compose.yaml comment on why) — the
# published host port is WEB_PORT, mapped by this repo's own compose.yaml.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # Vite fingerprints every built asset filename with a content hash, so an
    # asset URL never changes without also changing the file — safe to cache
    # forever. index.html is the one file that DOES change without a new
    # URL (it's what points at the current hashed assets), so it must never
    # be cached, or a deploy is invisible to anyone with a warm cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /_health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Client-side routing (react-router): any path that isn't a real static
    # file falls back to index.html, which then resolves the route in JS.
    # Without this, a hard refresh on e.g. /path 404s at the web server
    # instead of ever reaching the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
