# Serves the built SPA. Listens on 8080, matching every other internal
# service in this stack (see Qamooscheh's compose.yaml comment on why) — the
# published host port is WEB_PORT, mapped by this repo's own compose.yaml.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # Security headers.
    #
    # Auth tokens live in localStorage (src/lib/storage.ts), so any script
    # execution this app doesn't intend is a full account takeover — the CSP
    # below is the main client-side mitigation available for that, and
    # `script-src` is the part actually doing that job.
    #
    # accounts.google.com entries: Google Identity Services, loaded on demand
    # by src/lib/googleIdentity.ts when VITE_GOOGLE_CLIENT_ID is set. The four
    # gsi/* paths are the set Google's own CSP guidance names.
    #
    # connect-src/img-src/media-src stay at `https:` rather than naming the
    # API and CDN origins, because those are baked into the bundle at BUILD
    # time from VITE_API_BASE_URL / VITE_CONTENT_BASE_URL (see Dockerfile) and
    # so aren't knowable to this static config. If you want them tightened,
    # this is the line to edit for your deployment — with the domain
    # convention deploy/host-nginx-app.conf.example describes, that's
    # `connect-src 'self' https://api.<domain> https://cdn.<domain>
    # https://accounts.google.com/gsi/;`.
    #
    # 'unsafe-inline' for style-src only: React sets element styles through
    # the CSSOM (which CSP doesn't govern), but GSI injects its own stylesheet
    # for the sign-in button. No script-src equivalent is needed — Vite emits
    # only external, hashed scripts.
    #
    # NOTE: nginx's add_header does NOT inherit into a location block that has
    # add_header directives of its own, which is why the two locations below
    # that set Cache-Control repeat this set verbatim. Edit all three together.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: https:; font-src 'self' data:; media-src 'self' https:; connect-src 'self' https:; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Vite fingerprints every built asset filename with a content hash, so an
    # asset URL never changes without also changing the file — safe to cache
    # forever. index.html is the one file that DOES change without a new
    # URL (it's what points at the current hashed assets), so it must never
    # be cached, or a deploy is invisible to anyone with a warm cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # Repeated from the server block — see the NOTE there.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: https:; font-src 'self' data:; media-src 'self' https:; connect-src 'self' https:; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;

        # Repeated from the server block — see the NOTE there.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: https:; font-src 'self' data:; media-src 'self' https:; connect-src 'self' https:; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # `default_type` rather than `add_header Content-Type` so this block adds
    # no headers of its own and therefore still inherits the server-level
    # security headers above (same nginx rule the NOTE there describes).
    location = /_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Client-side routing (react-router): any path that isn't a real static
    # file falls back to index.html, which then resolves the route in JS.
    # Without this, a hard refresh on e.g. /path 404s at the web server
    # instead of ever reaching the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
