name: Deploy

# Fires after CI finishes on master (a push, or the grader-published dispatch
# CI also runs on, which rebuilds master with the new grader) -- mirrors Qamooscheh's own deploy.yml.
# Runs on this repo's OWN self-hosted runner (docker/runner/), separate from
# Qamooscheh's -- a self-hosted runner registers against exactly one repo,
# so its runner can't pick up this repo's jobs.
# scripts/deploy-local.sh runs these same steps by hand on the box, for when
# Actions is down or blocked. A step added here belongs there too.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types: [completed]

jobs:
  deploy:
    # Only this repo's own pushes and dispatches: the branches filter matches the
    # head branch NAME, so a fork PR from a fork's master would otherwise get its
    # code built and run on the self-hosted runner.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, parsling-web]
    # This repo's real .env.docker (VITE_* build args) -- lives outside this
    # job's own disposable checkout, at a fixed path also bind-mounted into
    # the runner container itself (docker/runner/compose.yaml's
    # APP_ENV_FILE). Update both if this ever moves.
    env:
      ENV_FILE: /home/nicholas/qamooscheh/qamooscheh-web/.env.docker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # The grader this deploy ships is verified here and the image build keeps
      # exactly those files (fetch-grader.mjs --reuse-verified), so it is never
      # one the vectors haven't run against. public/grader/ is in the build context.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Fetch and verify the published grader
        run: node scripts/fetch-grader.mjs && node scripts/verify-grader.mjs

      # The commit becomes the build's version, sent to the API as X-Client.
      # A shell variable outranks --env-file in compose's interpolation.
      - name: Build image
        env:
          VITE_APP_VERSION: ${{ github.event.workflow_run.head_sha }}
        # --no-cache: the layers copy public/grader/ (fetched above), which a
        # cached layer of an unchanged source tree would hide when CI ran for
        # a grader-published dispatch.
        run: docker compose --env-file "$ENV_FILE" build --no-cache

      - name: Apply
        run: docker compose --env-file "$ENV_FILE" up -d

      # Probes web's OWN network namespace via `docker compose exec`, not
      # 127.0.0.1 on this job's own host -- this job runs INSIDE the
      # dockerized runner container, which has its own loopback entirely
      # separate from the actual host's. See Qamooscheh's own deploy.yml for
      # the full explanation of why curling a published host port from here
      # doesn't work.
      #
      # 127.0.0.1, not localhost, once inside the web container too: same
      # reason as compose.yaml's own healthcheck -- localhost resolves to
      # ::1 first here and nginx doesn't bind that side.
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if docker compose --env-file "$ENV_FILE" exec -T web wget -qO- http://127.0.0.1:8080/_health > /dev/null 2>&1; then
              echo "web healthy after ${i} check(s)."
              exit 0
            fi
            sleep 2
          done
          echo "web did not become healthy after deploy." >&2
          docker compose --env-file "$ENV_FILE" logs --tail=100 web >&2
          exit 1

      - name: Prune old images
        if: always()
        run: docker image prune -f
