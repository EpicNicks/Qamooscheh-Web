name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Node 24 to match the Dockerfile's node:24-alpine build stage, so CI
      # fails on the same toolchain the deployed bundle is built with.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run lint

      # `npm run build` runs `tsc -b` itself, but running it separately first
      # reports a type error as a type error rather than as a build failure.
      - run: npx tsc -b

      - run: npm run build

      - run: npm run test

  # The published grader (API_SPEC.md §7) the app grades and prices XP with:
  # downloads the build pinned in grader.lock.json and runs the backend's own
  # verify vectors and xp-vectors through the same glue code the browser
  # loads it with (src/grader/bundle.ts, runtime.ts). Needs no npm install:
  # the script only uses Node, which runs the .ts it imports natively.
  grader:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - run: node scripts/verify-grader.mjs
