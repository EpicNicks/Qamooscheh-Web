name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The backend sends this when it publishes a new grader build, so web rebuilds
  # with it and Deploy (which follows CI on master) ships it.
  repository_dispatch:
    types: [grader-published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Node 24 to match the Dockerfile's node:24-alpine build stage, so CI
      # fails on the same toolchain the deployed bundle is built with.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The latest published grader, shipped with the build (scripts/fetch-grader.mjs,
      # which npm run build runs too). The backend's verify vectors and
      # xp-vectors must pass against exactly these files, through the loader
      # glue the app uses (src/grader/runtime.ts), before the build is accepted.
      - run: node scripts/fetch-grader.mjs

      - run: node scripts/verify-grader.mjs

      # From here on every step builds the files just verified (the marker
      # verify-grader.mjs leaves makes npm run build keep them).

      - run: npm run lint

      # `npm run build` runs `tsc -b` itself, but running it separately first
      # reports a type error as a type error rather than as a build failure.
      - run: npx tsc -b

      - run: npm run build

      - run: npm run test
